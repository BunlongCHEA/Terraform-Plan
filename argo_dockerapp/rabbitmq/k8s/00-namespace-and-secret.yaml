apiVersion: v1
kind: Namespace
metadata:
  name: rabbitmq
---
# Change these before applying, or manage via GitLab CI/CD variables + kubectl
# create secret (same pattern your repo already uses for gitlab-registry).
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-auth
  namespace: rabbitmq
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: "admin"
  RABBITMQ_DEFAULT_PASS: "CHANGE_ME_BEFORE_APPLYING"
