cluster.name: kyc-logging-cluster
node.name: es-node-1

# Single node — no other master-eligible nodes to discover
discovery.type: single-node

network.host: 0.0.0.0
http.port: 9200

path.data: /usr/share/elasticsearch/data
path.logs: /usr/share/elasticsearch/logs

# Security: keep it simple for an internal-only namespace.
# Turn these on (and mount certs) later if Elasticsearch is ever exposed
# outside the cluster network.
xpack.security.enabled: false
xpack.security.enrollment.enabled: false
xpack.security.http.ssl.enabled: false
xpack.security.transport.ssl.enabled: false

# Avoid the ES container refusing to start on memory-locked hosts
bootstrap.memory_lock: false
