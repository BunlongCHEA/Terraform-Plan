apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging
  labels:
    app: fluent-bit
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      tolerations:
        - operator: Exists   # run on every node, including tainted ones
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:4.2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
            type: DirectoryOrCreate   # your cluster is k3s/containerd, not Docker,
                                      # so this path may not exist — DirectoryOrCreate
                                      # avoids a mount failure; actual logs are read
                                      # via the /var/log mount above (k3s symlinks
                                      # /var/log/containers -> /var/log/pods, both
                                      # under /var/log)
        - name: config
          configMap:
            name: fluent-bit-config
