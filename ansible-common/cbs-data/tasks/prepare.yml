---
# Namespace cbs-data + NetworkPolicy + data-node label. Safe to run many times.
- name: "[MASTER] Label data node {{ cbs_data_host }} with {{ cbs_data_node_label }}=true (matched by IP)"
  shell: |
    set -euo pipefail
    NODE=$(kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.addresses[?(@.type=="InternalIP")].address}{"\n"}{end}' \
           | awk -v ip="{{ hostvars[cbs_data_host]['ansible_default_ipv4']['address'] }}" '$2==ip {print $1}')
    [ -n "$NODE" ] || { echo "No K3s node with the IP of {{ cbs_data_host }}"; exit 1; }
    kubectl label node "$NODE" {{ cbs_data_node_label }}=true --overwrite
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: data_label
  changed_when: "'labeled' in data_label.stdout"
  when: is_master

- name: "[MASTER] Namespace {{ cbs_data_namespace }} + NetworkPolicy"
  include_tasks: "{{ cbs_files_dir }}/tasks/apply.yml"
  vars:
    cbs_manifest: namespace
    cbs_wait_statefulset: ""
