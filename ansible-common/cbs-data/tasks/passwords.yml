---
# Generate (first run) or load (later runs) every CBS password into the fact "pw".
# Files: ansible-common/access-info/cbs-data/secrets/<name>  (letters+digits only,
# safe inside URIs). Delete one file and re-run its playbook to rotate it.
- name: "[LOCAL] Create {{ cbs_secrets_dir }}"
  file:
    path: "{{ cbs_secrets_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: "[LOCAL] Generate / load CBS passwords"
  set_fact:
    pw: >-
      {%- set names = {'postgres_admin': 32, 'mongo_admin': 32, 'redis_admin': 32, 'rabbitmq_admin': 32} -%}
      {%- for e in cbs_envs -%}
        {%- set _ = names.update({
              'pg_' ~ e: 32, 'mongo_' ~ e: 32, 'redis_' ~ e: 32, 'rabbitmq_' ~ e: 32,
              'jwt_' ~ e: 64, 'hmac_' ~ e: 64, 'superadmin_' ~ e: 24, 'kycmq_' ~ e: 32}) -%}
      {%- endfor -%}
      {%- set out = {} -%}
      {%- for n, l in names.items() -%}
        {%- set _ = out.update({n: lookup('ansible.builtin.password', cbs_secrets_dir ~ '/' ~ n ~ ' length=' ~ l ~ ' chars=ascii_letters,digits')}) -%}
      {%- endfor -%}
      {{ out }}
  no_log: true
  run_once: true
  delegate_to: localhost
  become: false
