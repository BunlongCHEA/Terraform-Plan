---
# ===========================================
# Uninstall rabbitmq (K3s namespace "databases") — DELETES ALL ITS DATA,
# for every project that uses it. Asks for a typed confirmation.
# Deletes the ArgoCD Application first; the namespace and the other databases stay.
# ===========================================
- name: Uninstall rabbitmq
  hosts: os_servers
  become: true
  gather_facts: false
  vars:
    kubeconfig_path: /etc/rancher/k3s/k3s.yaml
    first_master: "{{ groups['os_servers'][0] }}"
    db_namespace: "{{ databases_namespace | default('databases') }}"
    argocd_namespace: argocd
    db_name: rabbitmq

  tasks:
    - name: Confirm
      pause:
        prompt: "This DELETES {{ db_name }} and ALL its data (every project). Type: delete {{ db_name }}"
      register: confirm
      run_once: true

    - name: Stop unless confirmed
      fail:
        msg: "Not confirmed — nothing deleted."
      when: confirm.user_input | trim != 'delete ' ~ db_name
      run_once: true

    - name: "[MASTER] Delete ArgoCD Application {{ db_name }} (cascade: StatefulSet + Service)"
      command: >
        kubectl delete application {{ db_name }} -n {{ argocd_namespace }}
        --ignore-not-found --wait=true --timeout=300s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: app_delete
      changed_when: "'deleted' in app_delete.stdout"
      when: inventory_hostname == first_master

    - name: "[MASTER] Delete leftovers: StatefulSet/Service (if created without ArgoCD), Secret, volume"
      shell: |
        K="kubectl -n {{ db_namespace }}"
        $K delete statefulset/{{ db_name }} service/{{ db_name }} --ignore-not-found --wait=true
        $K delete secret {{ db_name }}-admin --ignore-not-found
        $K delete pvc data-{{ db_name }}-0 --ignore-not-found
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      when: inventory_hostname == first_master

    - name: Summary
      debug:
        msg: "{{ db_name }} removed from namespace {{ db_namespace }} (access-info file kept)."
      run_once: true
