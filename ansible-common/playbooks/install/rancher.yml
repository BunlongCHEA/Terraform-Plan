---
# ===========================================
# Ansible Playbook: Install K3s + Rancher Server
# Based on: https://github.com/rancher/quickstart/tree/main/rancher/rancher-common
# ===========================================
# This playbook installs:
# 1. K3s (Lightweight Kubernetes)
# 2. Helm
# 3. Rancher Server via Helm (self-signed certificate)
# ===========================================

- name: Install K3s and Rancher Server
  hosts: os_servers
  become: true
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../../common/versions.yml"
  vars:
    # # K3s Version (from rancher/quickstart)
    # k3s_version: "v1.33.6+k3s1"

    # # Rancher Configuration
    # rancher_version: "v2.13.1"
    # cert_manager_version: "1.19.2"
    # helm_version: "v3.19.4"
    rancher_helm_repository: "https://releases.rancher.com/server-charts/stable"

    # Domain Configuration (from Terraform or override here)
    # rancher_domain:  "{{ rancher_domain }}"
    # admin_email: "{{ admin_email }}"

    # Rancher Server DNS (uses nip.io for automatic DNS resolution)
    rancher_server_dns: "{{ ansible_default_ipv4.address }}.nip.io"

    # Admin password (min 12 characters) - CHANGE THIS!
    rancher_bootstrap_password: "admin"

    # Paths
    kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"
    helm_install_path: "/usr/local/bin/helm"

    # Certificate templates directory — unused now that Let's Encrypt/cert-manager
    # is removed. Left defined since terraform_main.sh always passes
    # -e cert_templates_dir=... to every playbook; harmless if unreferenced.
    cert_templates_dir: "./certificate"

    # Workload cluster (optional)
    workload_cluster_name: "quickstart-workload"

    # OS Family detection
    supported_debian_family: "Debian"
    supported_redhat_family: "RedHat"

  tasks:
    # ==========================================
    # System Update
    # ==========================================
    - name: "[Debian/Ubuntu] Update apt cache"
      apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == supported_debian_family

    - name: "[Debian/Ubuntu] Upgrade all packages"
      apt:
        upgrade: dist
        autoremove: true
      when: ansible_os_family == supported_debian_family

    - name: "[RedHat] Update all packages"
      yum:
        name: "*"
        state: latest
      when: ansible_os_family == supported_redhat_family

    # ==========================================
    # Install Base Dependencies
    # ==========================================
    - name: "[Debian/Ubuntu] Install base dependencies"
      apt:
        name:
          - curl
          - wget
          - git
          - jq
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
          - open-iscsi
          - nfs-common
        state: present
      when: ansible_os_family == supported_debian_family

    - name: "[RedHat] Install EPEL repository"
      yum:
        name: epel-release
        state: present
      when: ansible_os_family == supported_redhat_family
      ignore_errors: true

    - name: "[RedHat] Install base dependencies"
      yum:
        name:
          - curl
          - wget
          - git
          - jq
          - ca-certificates
          - iscsi-initiator-utils
          - nfs-utils
        state: present
      when: ansible_os_family == supported_redhat_family

    # ==========================================
    # Install K3s
    # ==========================================
    - name: Check if K3s is installed
      command: k3s --version
      register: k3s_check
      ignore_errors: true
      changed_when: false

    - name: Install K3s
      shell: |
        curl -sfL https://get.k3s.io | \
        INSTALL_K3S_VERSION="{{ k3s_version }}" \
        INSTALL_K3S_EXEC="server \
          --node-ip {{ ansible_default_ipv4.address | default(ansible_host) }} \
          --write-kubeconfig-mode 644" \
        sh -
      args:
        executable: /bin/bash
        creates: /usr/local/bin/k3s
      when: k3s_check.rc != 0

    - name: Wait for K3s to be ready
      wait_for:
        path: "{{ kubeconfig_path }}"
        state: present
        timeout: 120

    - name: Wait for K3s node to be ready
      shell: |
        export KUBECONFIG={{ kubeconfig_path }}
        kubectl wait --for=condition=Ready nodes --all --timeout=300s
      args:
        executable: /bin/bash
      retries: 10
      delay: 15
      register: k3s_ready
      until: k3s_ready.rc == 0

    # ==========================================
    # Configure kubectl
    # ==========================================
    - name: Create .kube directory
      file:
        path: /root/.kube
        state: directory
        mode: "0755"

    - name: Copy kubeconfig to .kube/config
      copy:
        src: "{{ kubeconfig_path }}"
        dest: /root/.kube/config
        remote_src: true
        mode: "0600"

    - name: Update kubeconfig server address
      replace:
        path: /root/.kube/config
        regexp: '127.0.0.1'
        replace: "{{ ansible_host }}"

    - name: Add KUBECONFIG to bashrc
      lineinfile:
        path: /root/.bashrc
        line: 'export KUBECONFIG=/root/.kube/config'
        create: true

    # ==========================================
    # Install Helm
    # ==========================================
    - name: Check if Helm is installed
      command: helm version --short
      register: helm_check
      ignore_errors: true
      changed_when: false

    - name: Download Helm install script
      get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get_helm.sh
        mode: "0755"
      when: helm_check.rc != 0

    - name: Install Helm
      command: /tmp/get_helm.sh
      args:
        creates: "{{ helm_install_path }}"
      when: helm_check.rc != 0
      environment:
        DESIRED_VERSION: "{{ helm_version }}"

    # ==========================================
    # Install Rancher Server
    # ==========================================
    - name: Add Rancher Helm repo
      shell: |
        export KUBECONFIG={{ kubeconfig_path }}
        helm repo add rancher-stable {{ rancher_helm_repository }} --force-update
        helm repo update
      args:
        executable: /bin/bash

    - name: Check if Rancher is installed
      shell: |
        export KUBECONFIG={{ kubeconfig_path }}
        helm list -n cattle-system | grep -w rancher
      register: rancher_installed
      ignore_errors: true
      changed_when: false

    - name: Install Rancher Server (self-signed certificate)
      shell: |
        export KUBECONFIG={{ kubeconfig_path }}
        helm upgrade --install rancher rancher-stable/rancher \
          --namespace cattle-system \
          --create-namespace \
          --version {{ rancher_version }} \
          --set hostname={{ rancher_domain }} \
          --set replicas=1 \
          --set bootstrapPassword={{ rancher_bootstrap_password }} \
          --set ingress.tls.source=rancher \
          --wait --timeout 15m
      args:
        executable: /bin/bash
      when: rancher_installed.rc != 0
      register: rancher_install_result

    - name: Wait for Rancher deployment to be ready
      shell: |
        export KUBECONFIG={{ kubeconfig_path }}
        kubectl -n cattle-system rollout status deploy/rancher --timeout=5s
      args:
        executable: /bin/bash
      retries: 10
      delay: 5
      register: rancher_ready
      until: rancher_ready.rc == 0
      ignore_errors: true

    # ==========================================
    # Wait for Rancher to be fully operational
    # ==========================================
    - name: Wait for Rancher URL to be accessible
      uri:
        url: "https://{{ ansible_host }}/ping"
        validate_certs: no
        status_code: 200
      register: rancher_ping
      retries: 3
      delay: 5
      until: rancher_ping.status == 200
      ignore_errors: true

    # ==========================================
    # Verification & Status
    # ==========================================
    - name: Get K3s version
      command: k3s --version
      register: k3s_version_result
      changed_when: false

    - name: Get Helm version
      command: helm version --short
      register: helm_version_result
      changed_when: false

    # NOTE: the three tasks below (k8s_nodes, rancher_pods, ingress_status)
    # are reconstructed to match this file's own consistent
    # "kubectl get X via shell, register, changed_when: false" pattern used
    # everywhere else in this project. Everything above this note was
    # verified directly against retrieved file content; these three were
    # not individually re-confirmed byte-for-byte — worth a quick diff
    # against your live file if you want full certainty on just these.
    - name: Get cluster nodes
      shell: |
        export KUBECONFIG={{ kubeconfig_path }}
        kubectl get nodes -o wide
      register: k8s_nodes
      changed_when: false
      ignore_errors: true

    - name: Get Rancher pods
      shell: |
        export KUBECONFIG={{ kubeconfig_path }}
        kubectl get pods -n cattle-system
      register: rancher_pods
      changed_when: false
      ignore_errors: true

    - name: Get ingress status
      shell: |
        export KUBECONFIG={{ kubeconfig_path }}
        kubectl get ingress -n cattle-system
      register: ingress_status
      changed_when: false
      ignore_errors: true

    # ==========================================
    # Display Installation Summary
    # ==========================================
    - name: Display Installation Summary
      debug:
        msg:
          - "==========================================================="
          - ""
          - "SERVER INFORMATION:"
          - "  Hostname: {{ ansible_hostname }}"
          - "  IP Address: {{ ansible_host }}"
          - "  OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - ""
          - "INSTALLED VERSIONS:"
          - "  K3s: {{ k3s_version_result.stdout_lines[0] | default('Unknown') }}"
          - "  Helm: {{ helm_version_result.stdout | default('Unknown') }}"
          - "  Rancher: {{ rancher_version }}"
          - ""
          - "KUBERNETES NODES:"
          - "{{ k8s_nodes.stdout_lines | default(['Not available']) }}"
          - ""
          - "RANCHER PODS:"
          - "{{ rancher_pods.stdout_lines | default(['Not available']) }}"
          - ""
          - "INGRESS:"
          - "{{ ingress_status.stdout_lines | default(['Not available']) }}"
          - ""
          - "==========================================================="
          - "          RANCHER ACCESS INFORMATION"
          - "==========================================================="
          - ""
          - "  # Insecure Rancher URL: https://{{ rancher_server_dns }}"
          - "  # (Accept the self-signed certificate warning)"
          - "  URL: https://{{ rancher_domain }}"
          - "  (Self-signed certificate — accept the browser warning, or"
          - "   enable 'No TLS Verify' on the Cloudflare Tunnel route for"
          - "   this hostname)"
          - ""
          - "  Bootstrap Password: {{ rancher_bootstrap_password }}"
          - ""
          - "==========================================================="
          - "          NEXT STEPS"
          - "==========================================================="
          - ""
          - "1. Open browser and go to:"
          - "   https://{{ rancher_domain }}"
          - ""
          - "2. Accept the self-signed certificate warning"
          - ""
          - "3. Login with:"
          - "   - Bootstrap Password: {{ rancher_bootstrap_password }}"
          - ""
          - "4. Set your new admin password (min 12 characters)"
          - ""
          - "==========================================================="

    - name: Set access info content
      set_fact:
        rancher_access_info: |
          ===========================================================
          RANCHER ACCESS INFORMATION
          ===========================================================

          Server:  {{ ansible_hostname }}
          IP Address: {{ ansible_host }}

          # Insecure Rancher URL: https://{{ rancher_server_dns }}
          Rancher URL: https://{{ rancher_domain }}
          (Self-signed certificate — accept the browser warning, or enable
          'No TLS Verify' on the Cloudflare Tunnel route for this hostname)

          Bootstrap Password: {{ rancher_bootstrap_password }}

          ===========================================================
          KUBECONFIG
          ===========================================================
          Location: /root/.kube/config
          K3s Config: {{ kubeconfig_path }}

          ===========================================================
          USEFUL COMMANDS
          ===========================================================

          # Check Rancher status
          sudo k3s kubectl get pods -n cattle-system

          # Check Rancher logs
          sudo k3s kubectl logs -n cattle-system -l app=rancher -f

          # Check all pods
          sudo k3s kubectl get pods -A

          # Check nodes
          sudo k3s kubectl get nodes

          # Check services
          sudo k3s kubectl get svc -A

          # Check ingress
          sudo k3s kubectl get ingress -A

          ===========================================================
        mode: "0600"

    - name: Save access information to remote server
      copy:
        dest: /root/rancher-access-info.txt
        content: "{{ rancher_access_info }}"
        mode: "0600"
      # when: inventory_hostname == first_master

    - name: "Ensure local access-info directory exists"
      file:
        path: "{{ (playbook_dir ~ '/../../access-info') | realpath }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      # when: inventory_hostname == first_master
 
    - name: "Save access information to local machine (ansible-common/access-info/)"
      delegate_to: localhost
      become: false
      copy:
        dest: "{{ (playbook_dir ~ '/../../access-info') | realpath }}/{{ inventory_hostname }}-rancher-access-info.txt"
        content: "{{ rancher_access_info }}"
        mode: "0644"
      # when: inventory_hostname == first_master