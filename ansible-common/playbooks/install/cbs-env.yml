---
# ===========================================
# Ansible Playbook: write the CBS env files for Jenkins
#
#   ansible-common/access-info/cbs-data/cbs-uat.env   → Jenkins Secret file cbs-uat-env
#   ansible-common/access-info/cbs-data/cbs-prod.env  → Jenkins Secret file cbs-prod-env
#
#   Uses the same generated passwords as postgres/mongodb/redis/rabbitmq.yml.
#   Run it AFTER those four (it checks they are running), and again whenever
#   you rotate a password.
#
# Run: ./terraform_main.sh raspberrypi cbs-env
# Optional in group_vars/all.yml (otherwise CHANGE_ME in the files):
#   cbs_cors_origins / cbs_kyc_base_url / cbs_kyc_api_key : {uat: "...", prod: "..."}
# ===========================================
- name: Write CBS env files (cbs-uat.env / cbs-prod.env)
  hosts: os_servers
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../common/versions.yml"
    - "{{ playbook_dir }}/../../cbs-data/vars.yml"
  vars:
    cbs_cors_origins: {}
    cbs_kyc_base_url: {}
    cbs_kyc_api_key: {}

  tasks:
    - name: Passwords
      include_tasks: "{{ cbs_files_dir }}/tasks/passwords.yml"

    - name: "[MASTER] Check the 4 data services are running"
      command: >
        kubectl -n {{ cbs_data_namespace }} get statefulset postgres mongodb redis rabbitmq
        -o jsonpath='{range .items[*]}{.metadata.name}={.status.readyReplicas}{"\n"}{end}'
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: data_ready
      changed_when: false
      failed_when: false
      when: is_master

    - name: Warn about missing / not-ready services
      debug:
        msg: >-
          WARNING: not all data services are ready ({{ data_ready.stdout_lines | default([]) | join(', ') or data_ready.stderr }}).
          The env files are still written, but CBS will not start until all four run.
      when:
        - is_master
        - data_ready.rc != 0 or (data_ready.stdout_lines | select('search', '=1$') | list | length) < 4

    - name: "[LOCAL] Write cbs-uat.env / cbs-prod.env"
      template:
        src: "{{ cbs_files_dir }}/templates/cbs.env.j2"
        dest: "{{ cbs_access_dir }}/cbs-{{ e }}.env"
        mode: "0600"
      loop: "{{ cbs_envs }}"
      loop_control:
        loop_var: e
      no_log: true
      delegate_to: localhost
      become: false
      run_once: true

    - name: "[LOCAL] Lines still to fill in"
      shell: grep -H '=.*CHANGE_ME' {{ cbs_access_dir }}/cbs-*.env | sed 's/=.*/=CHANGE_ME/' || true
      register: todo
      changed_when: false
      delegate_to: localhost
      become: false
      run_once: true

    - name: Summary
      debug:
        msg: "{{ [
          'Written: ' ~ cbs_access_dir ~ '/cbs-uat.env  → Jenkins credential cbs-uat-env',
          'Written: ' ~ cbs_access_dir ~ '/cbs-prod.env → Jenkins credential cbs-prod-env',
          'Upload : Jenkins → Manage Jenkins → Credentials → System → Global → (Add | Update) → Secret file'
        ] + (['Fill in first:'] + todo.stdout_lines if todo.stdout_lines else ['Nothing left to fill in.']) }}"
      run_once: true
