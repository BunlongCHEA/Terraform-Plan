---
# ===========================================
# Ansible Playbook: MongoDB (inside K3s)
#
#   One shared MongoDB server for all projects, admin user only:
#     user root / mongodb_admin_password (group_vars/all.yml), authSource=admin
#   Create project databases/users yourself (examples in the access-info file).
#   MongoDB 5+ needs a CPU with AVX (x86) / ARMv8.2-A (arm64) on the data node.
#
#   Namespace : databases   (databases_namespace)
#   Address   : mongodb.databases.svc.cluster.local:27017
#   Data      : local-path volume on the node labelled data-node=true
#
# Run:  ./terraform_main.sh raspberrypi mongodb
# Info: ansible-common/access-info/<first-master>-mongodb-access-info.txt
# ===========================================
- name: Install MongoDB
  hosts: os_servers
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../common/versions.yml"
  vars:
    kubeconfig_path: /etc/rancher/k3s/k3s.yaml
    first_master: "{{ groups['os_servers'][0] }}"
    is_master: "{{ inventory_hostname == first_master }}"
    db_namespace: "{{ databases_namespace | default('databases') }}"
    db_node: "{{ databases_node | default(groups['os_servers'][1] if (groups['os_servers'] | length) > 1 else groups['os_servers'][0]) }}"
    db_node_label: data-node
    db_size: "{{ mongodb_storage_size | default('10Gi') }}"
    db_cache_gb: "{{ mongodb_cache_gb | default('0.5') }}"
    db_host: "mongodb.{{ db_namespace }}.svc.cluster.local"
    access_info_dir: "{{ (playbook_dir ~ '/../../access-info') | realpath }}"

  tasks:
    - name: Check mongodb_admin_password
      assert:
        that:
          - mongodb_admin_password is defined
          - mongodb_admin_password | length >= 12
          - mongodb_admin_password is match('^[A-Za-z0-9._~-]+$')
        fail_msg: "Set mongodb_admin_password in <target>/group_vars/all.yml: min 12 chars; letters, digits and . _ ~ - only (safe in URIs). Generate: openssl rand -hex 24"
      run_once: true

    - name: "[MASTER] Label {{ db_node }} with {{ db_node_label }}=true (matched by IP)"
      shell: |
        set -euo pipefail
        NODE=$(kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.addresses[?(@.type=="InternalIP")].address}{"\n"}{end}' \
               | awk -v ip="{{ hostvars[db_node]['ansible_default_ipv4']['address'] }}" '$2==ip {print $1}')
        [ -n "$NODE" ] || { echo "No K3s node with the IP of {{ db_node }}"; exit 1; }
        kubectl label node "$NODE" {{ db_node_label }}=true --overwrite
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: node_label
      changed_when: "'labeled' in node_label.stdout"
      when: is_master

    - name: "[MASTER] Render manifest"
      copy:
        dest: /root/mongodb.yml
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: {{ db_namespace }}
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: mongodb-admin
            namespace: {{ db_namespace }}
          type: Opaque
          stringData:
            MONGO_INITDB_ROOT_USERNAME: "root"
            MONGO_INITDB_ROOT_PASSWORD: "{{ mongodb_admin_password }}"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: mongodb
            namespace: {{ db_namespace }}
            labels: {app.kubernetes.io/name: mongodb}
          spec:
            selector: {app.kubernetes.io/name: mongodb}
            ports:
              - {name: mongodb, port: 27017, targetPort: 27017}
          ---
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: mongodb
            namespace: {{ db_namespace }}
            labels: {app.kubernetes.io/name: mongodb}
          spec:
            serviceName: mongodb
            replicas: 1
            selector:
              matchLabels: {app.kubernetes.io/name: mongodb}
            template:
              metadata:
                labels: {app.kubernetes.io/name: mongodb}
              spec:
                nodeSelector:
                  {{ db_node_label }}: "true"
                containers:
                  - name: mongodb
                    image: {{ mongodb_image }}
                    args: ["--wiredTigerCacheSizeGB", "{{ db_cache_gb }}"]
                    ports: [{containerPort: 27017, name: mongodb}]
                    envFrom:
                      - secretRef: {name: mongodb-admin}
                    readinessProbe:
                      exec: {command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]}
                      periodSeconds: 10
                      timeoutSeconds: 5
                    livenessProbe:
                      exec: {command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]}
                      periodSeconds: 30
                      timeoutSeconds: 10
                      failureThreshold: 6
                    resources:
                      requests: {cpu: 200m, memory: 512Mi}
                      limits: {memory: 2Gi}
                    volumeMounts:
                      - {name: data, mountPath: /data/db}
            volumeClaimTemplates:
              - metadata: {name: data}
                spec:
                  accessModes: ["ReadWriteOnce"]
                  storageClassName: local-path
                  resources: {requests: {storage: {{ db_size }}}}
      no_log: true
      when: is_master

    - name: "[MASTER] Apply manifest"
      command: kubectl apply -f /root/mongodb.yml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: db_apply
      changed_when: "'created' in db_apply.stdout or 'configured' in db_apply.stdout"
      when: is_master

    - name: "[MASTER] Remove rendered manifest (contains the password)"
      file:
        path: /root/mongodb.yml
        state: absent
      when: is_master

    - name: "[MASTER] Wait for MongoDB (first start pulls the image: up to 10 min)"
      command: kubectl -n {{ db_namespace }} rollout status statefulset/mongodb --timeout=600s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false
      when: is_master

    - name: "[MASTER] Server version"
      command: kubectl -n {{ db_namespace }} exec mongodb-0 -- mongosh --quiet --eval "db.version()"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: db_version
      changed_when: false
      when: is_master

    - name: "[LOCAL] Save access info (ansible-common/access-info/)"
      copy:
        dest: "{{ access_info_dir }}/{{ first_master }}-mongodb-access-info.txt"
        mode: "0600"
        content: |
          ===========================================================
          MONGODB ACCESS INFORMATION  (generated {{ ansible_date_time.iso8601 }})
          ===========================================================
          Version     : {{ db_version.stdout | default('') }}
          Namespace   : {{ db_namespace }}   (node {{ db_node }}, label {{ db_node_label }}=true)
          In cluster  : {{ db_host }}:27017
          Admin       : root / {{ mongodb_admin_password }}   (authSource=admin)
          Admin URI   : mongodb://root:{{ mongodb_admin_password }}@{{ db_host }}:27017/?authSource=admin

          Connect from your laptop (keep the terminal open):
            on {{ first_master }}:  sudo kubectl -n {{ db_namespace }} port-forward --address 0.0.0.0 svc/mongodb 27017:27017
            then MongoDB Compass →  mongodb://root:<password>@<{{ first_master }}-ip>:27017/?authSource=admin

          mongosh on the server:
            sudo kubectl -n {{ db_namespace }} exec -it mongodb-0 -- mongosh -u root -p '<password>' --authenticationDatabase admin

          Create a database + user for a project (example, in mongosh):
            use myapp
            db.createUser({user: "myapp", pwd: "<password>", roles: [{role: "readWrite", db: "myapp"}]})

          App connection string:
            mongodb://myapp:<password>@{{ db_host }}:27017/myapp?authSource=myapp
          ===========================================================
      delegate_to: localhost
      become: false
      run_once: true

    - name: Summary
      debug:
        msg:
          - "MongoDB is running: {{ db_host }}:27017  (admin: root, authSource=admin)"
          - "Access info: {{ access_info_dir }}/{{ first_master }}-mongodb-access-info.txt"
      run_once: true
