---
# ===========================================
# Ansible Playbook: PostgreSQL (inside K3s)
#
#   One shared PostgreSQL server for all projects, admin user only:
#     user postgres / postgres_admin_password (group_vars/all.yml)
#   Create project databases/users yourself (examples in the access-info file).
#
#   Namespace : databases   (databases_namespace)
#   Address   : postgres.databases.svc.cluster.local:5432
#   ArgoCD    : Application "postgres" (label stack=databases) — Service + StatefulSet via
#               the bedag/raw chart; the admin Secret is created by Ansible, not ArgoCD
#   Data      : local-path volume on the node labelled data-node=true
#               (2nd host by default — databases_node)
#
# Run:  ./terraform_main.sh raspberrypi postgres
# Info: ansible-common/access-info/<first-master>-postgres-access-info.txt
# ===========================================
- name: Install PostgreSQL
  hosts: os_servers
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../common/versions.yml"
  vars:
    kubeconfig_path: /etc/rancher/k3s/k3s.yaml
    first_master: "{{ groups['os_servers'][0] }}"
    is_master: "{{ inventory_hostname == first_master }}"
    db_namespace: "{{ databases_namespace | default('databases') }}"
    db_node: "{{ databases_node | default(groups['os_servers'][1] if (groups['os_servers'] | length) > 1 else groups['os_servers'][0]) }}"
    db_node_label: data-node
    argocd_namespace: argocd
    db_size: "{{ postgres_storage_size | default('20Gi') }}"
    db_host: "postgres.{{ db_namespace }}.svc.cluster.local"
    access_info_dir: "{{ (playbook_dir ~ '/../../access-info') | realpath }}"

  tasks:
    - name: Check postgres_admin_password
      assert:
        that:
          - postgres_admin_password is defined
          - postgres_admin_password | length >= 12
          - postgres_admin_password is match('^[A-Za-z0-9._~-]+$')
        fail_msg: "Set postgres_admin_password in <target>/group_vars/all.yml: min 12 chars; letters, digits and . _ ~ - only (safe in URIs). Generate: openssl rand -hex 24"
      run_once: true

    - name: "[MASTER] Label {{ db_node }} with {{ db_node_label }}=true (matched by IP)"
      shell: |
        set -euo pipefail
        NODE=$(kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.addresses[?(@.type=="InternalIP")].address}{"\n"}{end}' \
               | awk -v ip="{{ hostvars[db_node]['ansible_default_ipv4']['address'] }}" '$2==ip {print $1}')
        [ -n "$NODE" ] || { echo "No K3s node with the IP of {{ db_node }}"; exit 1; }
        kubectl label node "$NODE" {{ db_node_label }}=true --overwrite
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: node_label
      changed_when: "'labeled' in node_label.stdout"
      when: is_master

    - name: "[MASTER] Check ArgoCD is installed"
      command: kubectl get crd applications.argoproj.io
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: argocd_crd
      changed_when: false
      failed_when: false
      when: is_master

    - name: Fail if ArgoCD is not installed
      fail:
        msg: "ArgoCD not found. Install it first: ./terraform_main.sh <target> argocd"
      when: is_master and argocd_crd.rc != 0

    # The password stays OUT of ArgoCD (an Application spec is readable by
    # anyone with ArgoCD access): Ansible creates the Secret, ArgoCD only
    # manages the Service + StatefulSet that reference it.
    - name: "[MASTER] Namespace + admin Secret"
      shell: |
        set -euo pipefail
        kubectl create namespace {{ db_namespace }} --dry-run=client -o yaml | kubectl apply -f -
        kubectl -n {{ db_namespace }} create secret generic postgres-admin \
          --from-literal=POSTGRES_PASSWORD='{{ postgres_admin_password }}' \
          --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: secret_apply
      changed_when: "'created' in secret_apply.stdout or 'configured' in secret_apply.stdout"
      no_log: true
      when: is_master

    - name: "[MASTER] Render ArgoCD Application postgres"
      copy:
        dest: /root/argocd-app-postgres.yml
        mode: "0600"
        content: "{{ app_manifest | to_nice_yaml(indent=2, width=4096) }}"
      vars:
        app_manifest:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: postgres
            namespace: "{{ argocd_namespace }}"
            labels:
              stack: databases
            annotations:
              argocd.argoproj.io/compare-options: ServerSideDiff=true
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: default
            source:
              repoURL: "{{ raw_chart_repo }}"
              chart: raw
              targetRevision: "{{ raw_chart_version }}"
              helm:
                releaseName: postgres
                valuesObject:
                  resources: "{{ db_resources | from_yaml_all | list }}"
            destination:
              server: https://kubernetes.default.svc
              namespace: "{{ db_namespace }}"
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
                - ServerSideApply=true
              retry:
                limit: 5
                backoff: {duration: 10s, factor: 2, maxDuration: 3m}
        db_resources: |
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres
            namespace: {{ db_namespace }}
            labels: {app.kubernetes.io/name: postgres}
          spec:
            selector: {app.kubernetes.io/name: postgres}
            ports:
              - {name: postgres, port: 5432, targetPort: 5432}
          ---
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: postgres
            namespace: {{ db_namespace }}
            labels: {app.kubernetes.io/name: postgres}
          spec:
            serviceName: postgres
            replicas: 1
            selector:
              matchLabels: {app.kubernetes.io/name: postgres}
            template:
              metadata:
                labels: {app.kubernetes.io/name: postgres}
              spec:
                nodeSelector:
                  {{ db_node_label }}: "true"
                terminationGracePeriodSeconds: 60
                containers:
                  - name: postgres
                    image: {{ postgres_image }}
                    args: ["-c", "max_connections=200", "-c", "shared_buffers=256MB"]
                    ports: [{containerPort: 5432, name: postgres}]
                    env:
                      - name: POSTGRES_PASSWORD
                        valueFrom: {secretKeyRef: {name: postgres-admin, key: POSTGRES_PASSWORD}}
                      - {name: POSTGRES_INITDB_ARGS, value: "--auth-host=scram-sha-256"}
                    # First start (initdb / data recovery) can take minutes: liveness and
                    # readiness only begin after this succeeds (up to 10 min: 60 x 10s).
                    startupProbe:
                      exec: {command: ["pg_isready", "-U", "postgres"]}
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 60
                    readinessProbe:
                      exec: {command: ["pg_isready", "-U", "postgres"]}
                      periodSeconds: 10
                      timeoutSeconds: 5
                    livenessProbe:
                      exec: {command: ["pg_isready", "-U", "postgres"]}
                      periodSeconds: 20
                      timeoutSeconds: 5
                      failureThreshold: 6
                    resources:
                      requests: {cpu: 250m, memory: 512Mi}
                      limits: {memory: 2Gi}
                    volumeMounts:
                      # 18+ image layout: data in /var/lib/postgresql/<major>/docker (image default PGDATA)
                      - {name: data, mountPath: /var/lib/postgresql}
            volumeClaimTemplates:
              - metadata: {name: data}
                spec:
                  accessModes: ["ReadWriteOnce"]
                  storageClassName: local-path
                  resources: {requests: {storage: {{ db_size }}}}
      when: is_master

    - name: "[MASTER] Apply ArgoCD Application postgres"
      command: kubectl apply -f /root/argocd-app-postgres.yml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: app_apply
      changed_when: "'created' in app_apply.stdout or 'configured' in app_apply.stdout"
      when: is_master

    - name: "[MASTER] Remove rendered Application"
      file:
        path: /root/argocd-app-postgres.yml
        state: absent
      when: is_master

    - name: "[MASTER] Wait for ArgoCD: postgres Synced/Healthy (first start pulls the image: up to 10 min)"
      command: >
        kubectl get application postgres -n {{ argocd_namespace }}
        -o jsonpath='{.status.sync.status}/{.status.health.status}'
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: app_status
      until: app_status.stdout == "Synced/Healthy"
      retries: 5
      delay: 60
      changed_when: false
      when: is_master

    - name: "[MASTER] Server version"
      command: kubectl -n {{ db_namespace }} exec postgres-0 -- psql -U postgres -tAc "SELECT version()"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: db_version
      changed_when: false
      when: is_master

    - name: "[LOCAL] Save access info (ansible-common/access-info/)"
      copy:
        dest: "{{ access_info_dir }}/{{ first_master }}-postgres-access-info.txt"
        mode: "0600"
        content: |
          ===========================================================
          POSTGRESQL ACCESS INFORMATION  (generated {{ ansible_date_time.iso8601 }})
          ===========================================================
          Version     : {{ db_version.stdout | default('') }}
          Namespace   : {{ db_namespace }}   (node {{ db_node }}, label {{ db_node_label }}=true)
          ArgoCD      : Application postgres  (Applications → filter label stack=databases)
          In cluster  : {{ db_host }}:5432
          Admin       : postgres / {{ postgres_admin_password }}

          Connect from your laptop (keep the terminal open):
            on {{ first_master }}:  sudo kubectl -n {{ db_namespace }} port-forward --address 0.0.0.0 svc/postgres 5432:5432
            then DBeaver / psql →  host <{{ first_master }}-ip>  port 5432  user postgres

          psql shell on the server:
            sudo kubectl -n {{ db_namespace }} exec -it postgres-0 -- psql -U postgres

          Create a database + user for a project (example):
            CREATE ROLE myapp LOGIN PASSWORD '<password>';
            CREATE DATABASE myapp OWNER myapp;
            REVOKE ALL ON DATABASE myapp FROM PUBLIC;

          App connection string:
            jdbc:postgresql://{{ db_host }}:5432/<database>
          ===========================================================
      delegate_to: localhost
      become: false
      run_once: true

    - name: Summary
      debug:
        msg:
          - "PostgreSQL is running: {{ db_host }}:5432  (admin: postgres)"
          - "Access info: {{ access_info_dir }}/{{ first_master }}-postgres-access-info.txt"
      run_once: true
