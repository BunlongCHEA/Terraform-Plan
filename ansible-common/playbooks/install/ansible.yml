---
- name: Install / Upgrade Python3, pip, and Ansible on managed hosts
  hosts: os_servers
  become: true
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../common/versions.yml"
  vars:
    # Map OS family names for conditional installation
    # Ansible uses: "Debian" for Ubuntu/Debian, "RedHat" for RHEL/CentOS/Rocky/Alma
    supported_debian_family: "Debian"
    supported_redhat_family: "RedHat"

  tasks:
    # ==========================================
    # Preflight (All Nodes)
    # ==========================================
    - name: Show resolved vars_files path and loaded values
      debug:
        msg:
          - "vars_files: {{ (playbook_dir ~ '/../../common/versions.yml') | realpath }}"
          - "python_pip_version = {{ python_pip_version | default('UNDEFINED — vars_files failed to load!') }}"
          - "ansible_pip_version = {{ ansible_pip_version | default('UNDEFINED — vars_files failed to load!') }}"

    - name: Gather facts (no sudo required for this)
      setup:
      become: false

    - name: Verify passwordless sudo works for {{ ansible_user }}
      command: whoami
      become: true
      register: whoami_check
      changed_when: false

    # ==========================================
    # Ubuntu / Debian Installation
    # ==========================================
    - name: "[Debian/Ubuntu] Update apt cache"
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == supported_debian_family

    - name: "[Debian/Ubuntu] Upgrade all packages"
      apt:
        upgrade: dist
        autoremove: yes
      when: ansible_os_family == supported_debian_family

    - name: "[Debian/Ubuntu] Install/upgrade Python3 and dependencies"
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - python3-full
          - software-properties-common
          - curl
          - wget
          - git
        state: "{{ python_pip_version }}"   # via common/versions.yml
      when: ansible_os_family == supported_debian_family

    - name: "[Debian/Ubuntu] Create pip config directory"
      file:
        path: /root/.config/pip
        state: directory
        mode: '0755'
      when: ansible_os_family == supported_debian_family

    - name: "[Debian/Ubuntu] Configure pip for PEP 668 (Ubuntu 24.04+)"
      copy:
        dest: /root/.config/pip/pip.conf
        content: |
          [global]
          break-system-packages = true
        mode: '0644'
      when:
        - ansible_os_family == supported_debian_family
        - ansible_distribution_major_version | int >= 24

    - name: "[Debian/Ubuntu] Install/upgrade Ansible from apt (best-effort — pip below is authoritative)"
      apt:
        name: ansible
        state: latest
      when: ansible_os_family == supported_debian_family
      ignore_errors: true
      register: ansible_apt_result

    - name: "[Debian/Ubuntu] Ensure latest ansible-core via pip (apt builds lag upstream)"
      pip:
        name: ansible-core
        state: "{{ ansible_pip_version }}"   # "latest" via common/versions.yml
        executable: pip3
        extra_args: --ignore-installed  # defensive: survives even if the base image ships a dpkg-owned ansible-core from outside this playbook's control
      when: ansible_os_family == supported_debian_family

    # ==========================================
    # RHEL / CentOS / Rocky / AlmaLinux Installation
    # ==========================================
    - name: "[RedHat] Install EPEL repository"
      yum:
        name: epel-release
        state: present
      when: ansible_os_family == supported_redhat_family
      ignore_errors: true

    - name: "[RedHat] Update all packages"
      yum:
        name: "*"
        state: latest
      when: ansible_os_family == supported_redhat_family

    - name: "[RedHat] Install/upgrade Python3 and dependencies"
      yum:
        name:
          - python3
          - python3-pip
          - python3-devel
          - curl
          - wget
          - git
        state: "{{ python_pip_version }}"   # via common/versions.yml
        update_cache: yes
      when: ansible_os_family == supported_redhat_family

    - name: "[RedHat] Install/upgrade Ansible (best-effort — pip below is authoritative)"
      yum:
        name: ansible-core
        state: latest
      when: ansible_os_family == supported_redhat_family
      ignore_errors: true
      register: ansible_yum_result

    - name: "[RedHat] Ensure latest ansible-core via pip (yum builds lag upstream)"
      pip:
        name: ansible-core
        state: "{{ ansible_pip_version }}"   # via common/versions.yml
        executable: pip3
        extra_args: --ignore-installed
      when: ansible_os_family == supported_redhat_family

    # ==========================================
    # Verification (All OS)
    # ==========================================
    - name: Verify Python3 installation
      command: python3 --version
      register: python_version
      changed_when: false

    - name: Verify pip installation
      shell: pip3 --version || python3 -m pip --version
      register: pip_version
      changed_when: false

    - name: Verify Ansible installation
      command: ansible --version
      register: ansible_version_check
      changed_when: false

    - name: Display installed versions
      debug:
        msg:
          - "========================================="
          - "Hostname: {{ ansible_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "OS Family: {{ ansible_os_family }}"
          - "========================================="
          - "Python: {{ python_version.stdout }}"
          - "Pip: {{ pip_version.stdout }}"
          - "Ansible: {{ ansible_version_check.stdout_lines }}"
          - "========================================="