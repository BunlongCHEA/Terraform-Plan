---
# ===========================================
# Ansible Playbook: RabbitMQ (inside K3s)
#
#   One shared broker for all projects, admin user only:
#     user admin / rabbitmq_admin_password (group_vars/all.yml), vhost "/"
#   Create project vhosts/users yourself (examples in the access-info file).
#
#   Namespace : databases   (databases_namespace)
#   Address   : rabbitmq.databases.svc.cluster.local:5672   (management UI :15672)
#   ArgoCD    : Application "rabbitmq" (label stack=databases) — Service + StatefulSet via
#               the bedag/raw chart; the admin Secret is created by Ansible, not ArgoCD
#   Data      : local-path volume on the node labelled data-node=true
#
# Run:  ./terraform_main.sh raspberrypi rabbitmq
# Info: ansible-common/access-info/<first-master>-rabbitmq-access-info.txt
# ===========================================
- name: Install RabbitMQ
  hosts: os_servers
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../common/versions.yml"
  vars:
    kubeconfig_path: /etc/rancher/k3s/k3s.yaml
    first_master: "{{ groups['os_servers'][0] }}"
    is_master: "{{ inventory_hostname == first_master }}"
    db_namespace: "{{ databases_namespace | default('databases') }}"
    db_node: "{{ databases_node | default(groups['os_servers'][1] if (groups['os_servers'] | length) > 1 else groups['os_servers'][0]) }}"
    db_node_label: data-node
    argocd_namespace: argocd
    db_size: "{{ rabbitmq_storage_size | default('5Gi') }}"
    db_host: "rabbitmq.{{ db_namespace }}.svc.cluster.local"
    access_info_dir: "{{ (playbook_dir ~ '/../../access-info') | realpath }}"

  tasks:
    - name: Check rabbitmq_admin_password
      assert:
        that:
          - rabbitmq_admin_password is defined
          - rabbitmq_admin_password | length >= 12
          - rabbitmq_admin_password is match('^[A-Za-z0-9._~-]+$')
        fail_msg: "Set rabbitmq_admin_password in <target>/group_vars/all.yml: min 12 chars; letters, digits and . _ ~ - only (safe in URIs). Generate: openssl rand -hex 24"
      run_once: true

    - name: "[MASTER] Label {{ db_node }} with {{ db_node_label }}=true (matched by IP)"
      shell: |
        set -euo pipefail
        NODE=$(kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.addresses[?(@.type=="InternalIP")].address}{"\n"}{end}' \
               | awk -v ip="{{ hostvars[db_node]['ansible_default_ipv4']['address'] }}" '$2==ip {print $1}')
        [ -n "$NODE" ] || { echo "No K3s node with the IP of {{ db_node }}"; exit 1; }
        kubectl label node "$NODE" {{ db_node_label }}=true --overwrite
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: node_label
      changed_when: "'labeled' in node_label.stdout"
      when: is_master

    - name: "[MASTER] Check ArgoCD is installed"
      command: kubectl get crd applications.argoproj.io
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: argocd_crd
      changed_when: false
      failed_when: false
      when: is_master

    - name: Fail if ArgoCD is not installed
      fail:
        msg: "ArgoCD not found. Install it first: ./terraform_main.sh <target> argocd"
      when: is_master and argocd_crd.rc != 0

    # The password stays OUT of ArgoCD (an Application spec is readable by
    # anyone with ArgoCD access): Ansible creates the Secret, ArgoCD only
    # manages the Service + StatefulSet that reference it.
    - name: "[MASTER] Namespace + admin Secret"
      shell: |
        set -euo pipefail
        kubectl create namespace {{ db_namespace }} --dry-run=client -o yaml | kubectl apply -f -
        kubectl -n {{ db_namespace }} create secret generic rabbitmq-admin \
          --from-literal=RABBITMQ_DEFAULT_USER=admin --from-literal=RABBITMQ_DEFAULT_PASS='{{ rabbitmq_admin_password }}' \
          --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: secret_apply
      changed_when: "'created' in secret_apply.stdout or 'configured' in secret_apply.stdout"
      no_log: true
      when: is_master

    - name: "[MASTER] Render ArgoCD Application rabbitmq"
      copy:
        dest: /root/argocd-app-rabbitmq.yml
        mode: "0600"
        content: "{{ app_manifest | to_nice_yaml(indent=2, width=4096) }}"
      vars:
        app_manifest:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: rabbitmq
            namespace: "{{ argocd_namespace }}"
            labels:
              stack: databases
            annotations:
              argocd.argoproj.io/compare-options: ServerSideDiff=true
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: default
            source:
              repoURL: "{{ raw_chart_repo }}"
              chart: raw
              targetRevision: "{{ raw_chart_version }}"
              helm:
                releaseName: rabbitmq
                valuesObject:
                  resources: "{{ db_resources | from_yaml_all | list }}"
            destination:
              server: https://kubernetes.default.svc
              namespace: "{{ db_namespace }}"
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
                - ServerSideApply=true
              retry:
                limit: 5
                backoff: {duration: 10s, factor: 2, maxDuration: 3m}
        db_resources: |
          apiVersion: v1
          kind: Service
          metadata:
            name: rabbitmq
            namespace: {{ db_namespace }}
            labels: {app.kubernetes.io/name: rabbitmq}
          spec:
            selector: {app.kubernetes.io/name: rabbitmq}
            ports:
              - {name: amqp, port: 5672, targetPort: 5672}
              - {name: management, port: 15672, targetPort: 15672}
          ---
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: rabbitmq
            namespace: {{ db_namespace }}
            labels: {app.kubernetes.io/name: rabbitmq}
          spec:
            serviceName: rabbitmq
            replicas: 1
            selector:
              matchLabels: {app.kubernetes.io/name: rabbitmq}
            template:
              metadata:
                labels: {app.kubernetes.io/name: rabbitmq}
              spec:
                nodeSelector:
                  {{ db_node_label }}: "true"
                terminationGracePeriodSeconds: 60
                containers:
                  - name: rabbitmq
                    image: {{ rabbitmq_image }}
                    ports:
                      - {containerPort: 5672, name: amqp}
                      - {containerPort: 15672, name: management}
                    envFrom:
                      - secretRef: {name: rabbitmq-admin}
                    # First start (initdb / data recovery) can take minutes: liveness and
                    # readiness only begin after this succeeds (up to 10 min: 60 x 10s).
                    startupProbe:
                      exec: {command: ["rabbitmq-diagnostics", "-q", "ping"]}
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 60
                    readinessProbe:
                      exec: {command: ["rabbitmq-diagnostics", "-q", "ping"]}
                      periodSeconds: 15
                      timeoutSeconds: 10
                    livenessProbe:
                      exec: {command: ["rabbitmq-diagnostics", "-q", "status"]}
                      periodSeconds: 30
                      timeoutSeconds: 15
                      failureThreshold: 6
                    resources:
                      requests: {cpu: 200m, memory: 512Mi}
                      limits: {memory: 1Gi}
                    volumeMounts:
                      - {name: data, mountPath: /var/lib/rabbitmq}
            volumeClaimTemplates:
              - metadata: {name: data}
                spec:
                  accessModes: ["ReadWriteOnce"]
                  storageClassName: local-path
                  resources: {requests: {storage: {{ db_size }}}}
      when: is_master

    - name: "[MASTER] Apply ArgoCD Application rabbitmq"
      command: kubectl apply -f /root/argocd-app-rabbitmq.yml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: app_apply
      changed_when: "'created' in app_apply.stdout or 'configured' in app_apply.stdout"
      when: is_master

    - name: "[MASTER] Remove rendered Application"
      file:
        path: /root/argocd-app-rabbitmq.yml
        state: absent
      when: is_master

    - name: "[MASTER] Wait for ArgoCD: rabbitmq Synced/Healthy (first start pulls the image: up to 10 min)"
      command: >
        kubectl get application rabbitmq -n {{ argocd_namespace }}
        -o jsonpath='{.status.sync.status}/{.status.health.status}'
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: app_status
      until: app_status.stdout == "Synced/Healthy"
      retries: 40
      delay: 15
      changed_when: false
      when: is_master

    - name: "[MASTER] Server version"
      command: kubectl -n {{ db_namespace }} exec rabbitmq-0 -- rabbitmqctl -q version
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: db_version
      changed_when: false
      when: is_master

    - name: "[LOCAL] Save access info (ansible-common/access-info/)"
      copy:
        dest: "{{ access_info_dir }}/{{ first_master }}-rabbitmq-access-info.txt"
        mode: "0600"
        content: |
          ===========================================================
          RABBITMQ ACCESS INFORMATION  (generated {{ ansible_date_time.iso8601 }})
          ===========================================================
          Version     : {{ db_version.stdout | default('') }}
          Namespace   : {{ db_namespace }}   (node {{ db_node }}, label {{ db_node_label }}=true)
          ArgoCD      : Application rabbitmq  (Applications → filter label stack=databases)
          In cluster  : {{ db_host }}:5672   (management UI {{ db_host }}:15672)
          Admin       : admin / {{ rabbitmq_admin_password }}   (vhost /)
          Admin URI   : amqp://admin:{{ rabbitmq_admin_password }}@{{ db_host }}:5672/

          Management UI from your laptop (keep the terminal open):
            on {{ first_master }}:  sudo kubectl -n {{ db_namespace }} port-forward --address 0.0.0.0 svc/rabbitmq 15672:15672
            then open http://<{{ first_master }}-ip>:15672  and log in as admin

          Create a vhost + user for a project (example, on {{ first_master }}):
            R="sudo kubectl -n {{ db_namespace }} exec rabbitmq-0 -- rabbitmqctl"
            $R add_vhost myapp
            $R add_user myapp '<password>'
            $R set_permissions -p myapp myapp '.*' '.*' '.*'
          (or in the UI: Admin → Virtual Hosts / Users)

          App connection:
            host {{ db_host }}  port 5672  vhost myapp  user myapp
          ===========================================================
      delegate_to: localhost
      become: false
      run_once: true

    - name: Summary
      debug:
        msg:
          - "RabbitMQ is running: {{ db_host }}:5672 (UI :15672, admin: admin)"
          - "Access info: {{ access_info_dir }}/{{ first_master }}-rabbitmq-access-info.txt"
      run_once: true
