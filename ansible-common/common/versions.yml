---
# --- Ansible itself (ansible.yml) ---
ansible_pip_version: "latest"
python_pip_version: "latest"

# --- K3s + Rancher stack (rancher.yml / rancher_multi.yml) ---
k3s_version: "v1.36.4+k3s1"
rancher_version: "v2.15.2"
cert_manager_version: "1.21.2"
helm_version: "v4.3.0"

# --- ArgoCD (argocd.yml) ---
argocd_version: "stable"

# --- Monitoring (prometheus_grafana.yml) ---
# Single Helm chart version -- prometheus/grafana/node-exporter/alertmanager
# versions all come bundled together from this one chart release.
# https://github.com/prometheus-community/helm-charts/releases  (tag kube-prometheus-stack-x.y.z)
kube_prometheus_stack_version: "92.2.0"   # Prometheus Operator v0.94.1

# --- Grafana : grafana-community (grafana.yml) ---
# https://github.com/grafana-community/helm-charts/releases  (tag grafana-x.y.z)
grafana_chart_version: "13.2.7"
# https://github.com/grafana-community/helm-charts/releases  (tag loki-x.y.z)
loki_chart_version: "18.13.7"
# Alloy chart still lives in grafana/helm-charts
# https://github.com/grafana/helm-charts/releases            (tag alloy-x.y.z)
alloy_chart_version: "1.13.0"
# https://github.com/grafana-community/helm-charts/releases  (tag tempo-x.y.z)
# (old grafana/tempo chart is deprecated; 3.x = Tempo 3, monolithic)
tempo_chart_version: "3.1.0"         # app Tempo 3.1.0

# --- Logging (logging.yml) ---
# Elasticsearch + Kibana image version (Kibana always = Elasticsearch).
# https://github.com/elastic/elasticsearch/releases   (9.4.x / 9.5.x)
elasticsearch_version: "9.5.5"
# ECK = Elastic's operator; the only Helm route for 8.6+ / 9.x
# https://github.com/elastic/cloud-on-k8s/releases     (chart repo https://helm.elastic.co)
eck_operator_chart_version: "3.5.0"       # charts eck-operator
eck_stack_chart_version: "0.20.0"         # charts eck-elasticsearch / eck-kibana (from ECK 3.5.0)
# https://github.com/fluent/helm-charts/releases       (tag fluent-bit-x.y.z)
fluent_bit_chart_version: "0.58.3"        # app Fluent Bit 5.1.3
# https://github.com/open-telemetry/opentelemetry-helm-charts/releases (tag opentelemetry-collector-x.y.z)
otel_collector_chart_version: "0.175.1"   # app otelcol-contrib 0.161.0 

# --- Kyverno (kyverno.yml) ---
kyverno_version: "1.19.1"        # https://github.com/kyverno/kyverno/releases

# --- LazyTrivy + Trivy (lazytrivy.yml) ---
# lazytrivy_version: "1.2.9"      # https://github.com/owenrumney/lazytrivy/releases
# trivy_version: "0.74.0"         # https://github.com/aquasecurity/trivy/releases